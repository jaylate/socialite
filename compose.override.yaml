services:
  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app:Z
      # Keep node_modules and build cache isolated inside the container
      - /app/node_modules
      - /app/.next
    command: npm run dev
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=development
      - SOCIALITE_BASE_URL=http://gateway

  backend:
    build:
      target: build
    volumes:
      - ./backend:/src:Z
      # Keep binaries isolated inside the container
      - /src/bin
      - /src/obj
    command: dotnet watch run -v detailed --non-interactive --launch-profile http
    ports:
      - 5182:5182
    environment:
      - DOTNET_USE_POLLING_FILE_WATCHER=1
