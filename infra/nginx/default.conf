server {
	listen 80;

	location / {
		proxy_pass http://frontend:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_buffering off;
	}

	location /api/ {
		proxy_pass http://backend:5182;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_buffering off;
		proxy_connect_timeout 60s;
		proxy_send_timeout 60s;
		proxy_read_timeout 60s;
	}
}
